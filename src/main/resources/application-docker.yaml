spring:
  application:
    name: credit-service

  data:
    mongodb:
      uri: mongodb://admin:admin123@mongo:27017/creditdb?authSource=admin
    redis:
      host: redis
      port: 6379

server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

credit:
  payment:
    due-days: 30

resilience4j:
  circuitbreaker:
    instances:

      customerService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      accountService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

  timelimiter:
    instances:

      customerService:
        timeoutDuration: 2s

      accountService:
        timeoutDuration: 2s