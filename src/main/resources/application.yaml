spring:
  application:
    name: credit-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/creditdb
    redis:
      host: localhost
      port: 6379

server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

credit:
  payment:
    due-days: 30

resilience4j:
  circuitbreaker:
    instances:

      customerService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      accountService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

  timelimiter:
    instances:

      customerService:
        timeoutDuration: 2s

      accountService:
        timeoutDuration: 2s
